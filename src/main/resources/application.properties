# ================================
# ==== SERVER CONFIGURATION =====
# ================================

# Port on which the Spring Boot application will run
server.port=8080

# =======================================
# ==== POSTGRESQL CONFIGURATION (JPA) ===
# ==== Used for Department & Student ====
# =======================================

# JDBC URL for PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/Dept_management

# PostgreSQL DB username
spring.datasource.username=postgres

# PostgreSQL DB password
spring.datasource.password=123456

# PostgreSQL driver class
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate dialect for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Automatically update the database schema based on entity definitions
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (for debugging)
spring.jpa.show-sql=true

# ================================
# ==== MONGODB CONFIGURATION =====
# ==== Used for Staff Entity =====
# ================================

# MongoDB connection URI (local)
spring.data.mongodb.uri=mongodb://localhost:27017/Dept_management

# ================================
# ====== LOGGING SETTINGS ========
# ================================

# Enable Hibernate SQL logging (to see SQL queries)
logging.level.org.hibernate.SQL=DEBUG

# Set Spring framework logging level
logging.level.org.springframework=INFO

# Expose actuator endpoint for viewing request mappings
management.endpoints.web.exposure.include=mappings
